/* Identidade RAYO: monocromática, discreta, sem elementos decorativos excessivos. */
:root{--accent:#315774;--accentLight:#EAF0F5;--bg:#F7F8FA;--shadow:0 7px 28px rgba(27,48,68,.035)}
:root[data-theme="dark"]{--accent:#A1C5D8;--accentLight:#283F52}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--accent:#A1C5D8;--accentLight:#283F52}}
.brand{font-size:22px;padding-bottom:20px;gap:12px}
.brand-mark{height:41px;width:41px;min-width:41px;padding:6px;background:#1B3044;color:#fff;border-radius:13px}
.brand-name{font-size:23px;letter-spacing:-.07em;font-weight:800}
.brand-dot{color:#82AFC5}
.login-mark{height:58px;width:58px;padding:8px;background:#1B3044;border-radius:17px}
.login-box h1{font-size:32px;letter-spacing:-.07em}
.login-box p{margin:4px 0 25px}
.login-screen{background:linear-gradient(145deg,#152A3D,#273E53)}
.add-icon-btn{width:43px;min-width:43px;height:43px;padding:0;border-radius:13px;background:var(--fab-bg);color:var(--fab-fg);border:1px solid var(--fab-border)}
.square-action{min-width:31px;width:31px;padding:0}
.nav-heading{font-size:10px;letter-spacing:.095em}
.nav-btn{min-height:41px}
.side-bottom{border-top:0}
.card{box-shadow:var(--shadow)}
.btn:focus-visible,nav button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media(max-width:740px){.add-icon-btn{width:40px;min-width:40px;height:40px}.main-head .head-title{margin-bottom:0}}

/* RAYO 2.0 — Aparência independente por usuário */
.brand-mark{background:var(--primary-card,#1B3044)}.tile.main-tile{background:var(--primary-card,#233f5c);border-color:var(--primary-card,#233f5c)}

.item-symbol[style*=--cat-tint]{color:var(--cat-tint)}
.nav-btn .emoji-ico{font-size:19px}.fav .emoji-ico{margin-bottom:10px}

.palette-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:12px 0 23px}

async function refreshFromCloud(force=false){

 if(!authToken||cloudLoading||dirty||saveInProgress||saveConflict||(!force&&document.hidden)||(!force&&document.getElementById('m')?.classList.contains('open')))return;
 const activeToken=authToken;cloudLoading=true;
 try{
  let remote=await apiRequest('/state');
  if(activeToken!==authToken||dirty||saveInProgress)return;
  // Se a rede falhou no login, repetir a tentativa discretamente, sem abrir avisos.
  if(legacyImportPending&&authUser===LEGACY_OWNER_LOGIN&&Number(remote.revision)===0){
   const result=await autoImportLegacyData(remote,{user:{login:authUser}});
   if(activeToken!==authToken||dirty||saveInProgress)return;
   remote=result.stored;legacyImportPending=result.failed;
  }
  if(Number(remote.revision)>stateRevision){
   stateRevision=Number(remote.revision);S=normalizeS(remote.data);
   legacyImportPending=false;
   setCloudStatus('updating');applyAppearance();go();
  }
  setCloudStatus(legacyImportPending?'migration-error':'saved');

let rayoOcrLoading=null;
function loadReceiptOCR(){
 if(window.Tesseract?.createWorker)return Promise.resolve();
 if(rayoOcrLoading)return rayoOcrLoading;
 rayoOcrLoading=new Promise((resolve,reject)=>{
  const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';sc.async=true;
  sc.onload=()=>window.Tesseract?.createWorker?resolve():reject(new Error('Módulo de leitura indisponível'));
  sc.onerror=()=>reject(new Error('Não foi possível carregar a leitura de notas. Verifique a internet.'));
  document.head.appendChild(sc);
 }).catch(e=>{rayoOcrLoading=null;throw e});return rayoOcrLoading;
}
const parseReceiptMoney=s=>{
 const m=String(s||'').replace(/\s/g,'').match(/(?:R\$)?(\d{1,3}(?:\.\d{3})*,\d{2}|\d+,\d{2})/i);
 if(!m)return null;
 const n=Number(m[1].replace(/\./g,'').replace(',','.'));return Number.isFinite(n)&&n>0&&n<10000000?Math.round(n*100)/100:null;
};
function parseReceipt(text){
 const lines=String(text||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 const normalizeLine=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/\bT[O0]TA[L1I]\b/g,'TOTAL');
 const excluded=/CNPJ|CPF|TROCO|DESCONTO|SUB\s*TOTAL|TOTAL\s+DE\s+ITENS|TOTAL\s+DOS\s+ITENS|TRIBUT|QTD|QUANTIDADE|UNITARIO|V\.\s*UNIT|CODIGO|ITEM\s+TOTAL|VL\.?\s*TOTAL/;
 const amounts=line=>[...String(line||'').matchAll(/(?:R\$\s*)?(\d{1,3}(?:\.\d{3})*,\d{2}|\d+,\d{2})/gi)].map(m=>parseReceiptMoney(m[0])).filter(n=>n!==null);
 let best={amount:null,score:-1,line:''};
 for(let i=0;i<lines.length;i++){
  const line=lines[i],next=lines[i+1]||'',norm=normalizeLine(line),normNext=normalizeLine(next);
  if(excluded.test(norm))continue;
  const values=amounts(line),nextValues=amounts(next);
  let score=0,amount=null,source='';
  if(/(^|\s)TOTAL(?:\s|:|R\$|$)/.test(norm)&&values.length){score=/^TOTAL(?:\s|:|R\$|$)/.test(norm)?100:96;amount=values[values.length-1];source=line;}
  else if(/^TOTAL\b/.test(norm)&&!values.length&&nextValues.length&&!excluded.test(normNext)){score=94;amount=nextValues[nextValues.length-1];source=line+' '+next;}
  else if(/VALOR\s+TOTAL|TOTAL\s+GERAL|VALOR\s+(A\s*PAGAR|PAGO)|LIQUIDO\s+A\s+PAGAR/.test(norm)&&values.length){score=90;amount=values[values.length-1];source=line;}
  else if(/VALOR\s+(DO\s+)?(?:DEBITO|CREDITO)|VALOR\s*:/.test(norm)&&values.length){score=50;amount=values[values.length-1];source=line;}
  else if(/PAGAMENTO\s+TOTAL|TOTAL\s+PAGO/.test(norm)&&values.length){score=70;amount=values[values.length-1];source=line;}
  if(amount!==null&&score>best.score){best={amount,score,line:source};}
 }
 let date=today;
 for(const line of lines){
  const d=line.match(/(?:^|\D)(\d{2})[/\.\-](\d{2})[/\.\-](\d{4})(?:\D|$)/);
  if(!d)continue;
  const candidate=`${d[3]}-${d[2]}-${d[1]}`;
  if(validDate(candidate)&&candidate<='2100-12-31'&&candidate>='2000-01-01'){date=candidate;break}
 }
 const merchant=lines.slice(0,9).find(line=>line.length>3&&line.length<75&&!/CNPJ|CPF|DANFE|DOCUMENTO|AUXILIAR|NOTA FISCAL|CUPOM|ENDERECO|RUA\s|AVENIDA|EXTRATO|TELEFONE|www\.|https?:|\d{2}[/\.\-]\d{2}[/\.\-]\d{4}/i.test(line))||'Compra com nota fiscal';
 const description=merchant.replace(/[<>"'`]/g,'').slice(0,120);
 const catGuess=recommendCategory(description+' '+text.slice(0,500),'var');
 return {amount:best.amount??'',date,desc:description,cat:getCats('var').includes(catGuess)?catGuess:'Outros',raw:text,totalLine:best.line||''};
}
async function processReceiptImage(event){

 open_(`${modalHeader('Lendo nota fiscal','O RAYO está procurando o total da compra, data e estabelecimento.')}
 <div class="rayo-receipt-progress"><div class="spinner" aria-hidden="true"></div><strong id="receiptProgress">Preparando a leitura…</strong><small class="rayo-receipt-note">Fotos nítidas, retas e bem iluminadas geram resultados melhores.</small></div>`);
 let worker=null;
 try{
  await loadReceiptOCR();
  const status=$('#receiptProgress');if(status)status.textContent='Reconhecendo o texto da nota…';
  worker=await Tesseract.createWorker('por',1,{logger:m=>{if(m.status==='recognizing text'&&$('#receiptProgress'))$('#receiptProgress').textContent=`Lendo a nota… ${Math.round((m.progress||0)*100)}%`;}});
  const result=await worker.recognize(file);
  const data=parseReceipt(result.data?.text||'');
  showReceiptReview(data,data.amount?'':'Não foi possível identificar o total com segurança. Digite o valor antes de salvar.');
 }catch(e){
  showReceiptReview({amount:'',date:today,desc:'Compra com nota fiscal',cat:'Outros',raw:''},`Leitura automática indisponível: ${e.message}. Você pode preencher o gasto manualmente.`);
 }finally{if(worker)try{await worker.terminate()}catch{}}
}

 open_(`${modalHeader(title,'Preencha apenas o essencial.')}
 <div class="segmented" style="display:flex;margin-bottom:17px"><button class="${kind==='var'||kind==='fix'?'active':''}" style="flex:1" onclick="openQuick('var','${selectedDate}')">${I('arrowup','sm')} Gasto</button><button class="${kind==='rec'?'active':''}" style="flex:1" onclick="openQuick('rec','${selectedDate}')">${I('arrowdown','sm')} Ganho</button></div>
 <div class="field-grid"><div class="field full">${FIELD('Valor (R$)',`<input id="qValor" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0,00" autofocus value="${E(price)}" required>` )}</div>
 ${FIELD('Categoria',`<select id="qCat">${selectOpts(getCats(kind),selectedCat)}</select>`)}
 ${FIELD('Data',`<input id="qDate" type="date" value="${E(selectedDate)}" onchange="updateQuickStatusHint()" required>`)}
 <div class="field full">${FIELD('Descrição <span class="optional">(opcional)</span>',`<input id="qDesc" type="text" maxlength="120" value="${E(description)}" placeholder="Adicionar uma observação, se quiser" oninput="guessQuickCategory()">`)}</div>
 <div class="field full"><button class="btn light tiny" onclick="document.getElementById('qExtra').classList.toggle('hidden')">${I('sliders','sm')} Mais opções ${I('down','sm')}</button></div>
 <div id="qExtra" class="field-grid full ${source?.freq&&source.freq!=='unica'?'':'hidden'}">
 ${FIELD('Tipo de gasto',`<select id="qKind" onchange="quickChangeKind(this.value)"><option value="var" ${kind==='var'?'selected':''}>Variável</option><option value="fix" ${kind==='fix'?'selected':''}>Fixo</option><option value="rec" ${kind==='rec'?'selected':''}>Ganho</option></select>`)}
 ${FIELD('Repetição',`<select id="qFreq" onchange="document.getElementById('qEndWrap').classList.toggle('hidden',this.value==='unica')">${selectOpts([['unica','Uma vez'],['semanal','Toda semana'],['mensal','Todo mês'],['anual','Todo ano']],freq)}</select>`)}
 <div id="qEndWrap" class="field ${freq==='unica'?'hidden':''}">${FIELD('Repetir até <span class="optional">(opcional)</span>',`<input type="date" id="qEnd" value="${E(source?.endDate||'')}">`)}</div>
 ${FIELD('Forma de pagamento',`<select id="qMethod">${selectOpts([['','Não informado'],['Pix','Pix'],['Dinheiro','Dinheiro'],['Débito','Débito'],['Transferência','Transferência'],['Outro','Outro']],source?.method||fav?.method||'')}</select>`)}
 ${FIELD('Situação',`<select id="qPaid" onchange="updateQuickStatusHint()"><option value="auto" ${mode==='auto'?'selected':''}>Automática pela data</option><option value="1" ${mode==='1'?'selected':''}>${kind==='rec'?'Recebido (manual)':'Pago (manual)'}</option><option value="0" ${mode==='0'?'selected':''}>${kind==='rec'?'Previsto (manual)':'Pendente (manual)'}</option></select>`)}
 </div></div>
  <p id="quickDateStatusHint" class="rayo-status-hint" aria-live="polite"></p>
 ${isNew?`<label class="checkline"><input type="checkbox" id="qFav"> Guardar como lançamento favorito</label>`:''}
 <div class="modal-footer"><button class="btn light" onclick="close_()">Cancelar</button><button class="btn" onclick="saveQuick('${kind}','${E(editId||'')}')">${I('check','sm')} ${isNew?'Adicionar':'Salvar alterações'}</button></div>`);
 $('#qKind').value=kind;
  updateQuickStatusHint();
 // Keep status selection available even when optional panel is closed.
}
function updateQuickStatusHint(){
  const el=$('#quickDateStatusHint'),d=$('#qDate')?.value||today,mode=$('#qPaid')?.value||'auto';
  if(!el)return;
  el.textContent=mode!=='auto'?'Situação definida manualmente. Você pode voltar ao modo automático quando quiser.':d>today?'Previsto automaticamente. Quando chegar a data, será lançado sem precisar editar.':'Data atual ou anterior: lançado automaticamente. Isso não confirma a movimentação no banco.';
}
function quickChangeKind(k){const desc=$('#qDesc')?.value||'',date=$('#qDate')?.value||today,amount=$('#qValor')?.value||'',freq=$('#qFreq')?.value||'unica',paid=$('#qPaid')?.value||'auto';openQuick(k,date);if(desc)$('#qDesc').value=desc;if(amount)$('#qValor').value=amount;$('#qFreq').value=freq;$('#qPaid').value=paid;$('#qExtra').classList.remove('hidden')}
function saveQuick(originKind,editId=''){
 const value=Number($('#qValor')?.value),date=$('#qDate')?.value,kind=$('#qKind')?.value||originKind,cat=$('#qCat')?.value,desc=($('#qDesc')?.value||'').trim(),freq=$('#qFreq')?.value||'unica',endDate=$('#qEnd')?.value||'',paid=$('#qPaid')?.value==='1',method=$('#qMethod')?.value||'';
 if(!['rec','fix','var'].includes(kind)||!getCats(kind).includes(cat))return er('Confira a categoria escolhida.');
 if(!Number.isFinite(value)||value<=0||value>1e10)return er('Informe um valor maior que zero.');
 if(!validDate(date))return er('Informe uma data válida.');
 if(endDate&&(!validDate(endDate)||endDate<date))return er('A data final deve ser posterior à data inicial.');
 const original=editId?S[originKind]?.find(x=>x.id===editId):null;
 const pm=original?.pm?{...original.pm}:{},key=freq==='semanal'?date:date.slice(0,7),auto=$('#qPaid')?.value==='auto';
  // O lançamento automático calcula a situação pela data, sem gravar pagamento fictício.
  if(auto)delete pm[key];else pm[key]=paid;
 const item={id:original?.id||uid(),desc:desc||cat,valor:Math.round(value*100)/100,data:date,cat,freq,method,pm,managed:true,statusMode:auto?'auto':'manual',paused:original?.paused||false,pausedFrom:original?.pausedFrom,pausedRanges:original?.pausedRanges||[],skip:original?.skip||{},endDate};
 if(original){if(originKind!==kind)S[originKind]=S[originKind].filter(x=>x.id!==original.id);else S[originKind]=S[originKind].filter(x=>x.id!==original.id)}
 S[kind].push(item);
 if(!original&&$('#qFav')?.checked&&!S.favs.some(f=>f.kind===kind&&f.cat===cat&&f.desc===item.desc))S.favs.push({id:uid(),name:desc||cat,kind,cat,desc:item.desc,valor:item.valor,method});
 ym=date.slice(0,7);calendarSelected=date;save();close_();go();
}
function repeatEntry(kind,id){const x=S[kind]?.find(v=>v.id===id);if(!x)return;const fav={id:uid(),name:x.desc,kind,cat:x.cat,desc:x.desc,valor:x.valor,method:x.method||''};S.favs.push(fav);openQuick(kind,today,fav.id);S.favs.pop();const extra=$('#qExtra');if(extra){extra.classList.remove('hidden');$('#qFreq').value='unica';$('#qEndWrap').classList.add('hidden')}}
function editEntry(k,id){if(['rec','fix','var'].includes(k))return openQuick(k,null,null,id);return openGeneric(k,id)}
function togglePaid(kind,id,date){const y=date.slice(0,7);let x,old=false;
 if(['rec','fix','var'].includes(kind)){x=S[kind].find(v=>v.id===id);if(!x)return;old=statusOf(kind,x,date);x.pm=x.pm||{};x.pm[x.freq==='semanal'?date:y]=!old;x.managed=true;}
 else if(kind==='fat'){x=S.car.find(v=>v.id===id);if(!x)return;x.pm=x.pm||{};x.pm[y]=!x.pm[y];}
 else if(kind==='div'){x=S.div.find(v=>v.id===id);if(!x)return;const offset=mi(y)-mi(x.data.slice(0,7));old=has(x.pm,y)?!!x.pm[y]:offset<Number(x.pagas||0);x.pm=x.pm||{};x.pm[y]=!old;/* Number of installments initially paid is preserved; per-month marks live in pm. */}
 else return;
 save();go();}
function deleteEntry(kind,id,date){const x=S[kind]?.find(v=>v.id===id);if(!x)return;const recurring=['rec','fix','var'].includes(kind)&&x.freq&&x.freq!=='unica';open_(`${modalHeader('Excluir lançamento','Esta ação não pode ser desfeita.')}<p>${E(x.desc||x.nome||'Lançamento')}</p><div class="modal-footer" style="flex-direction:column">${recurring?`<button class="btn light" onclick="deleteOccurrence('${kind}','${id}','${date}')">Excluir apenas esta ocorrência</button>`:''}<button class="btn d" onclick="deleteForever('${kind}','${id}')">${recurring?'Excluir toda a recorrência':'Excluir definitivamente'}</button><button class="btn light" onclick="close_()">Cancelar</button></div>`)}
function deleteOccurrence(kind,id,date){const x=S[kind]?.find(v=>v.id===id);if(!x)return;x.skip=x.skip||{};x.skip[x.freq==='semanal'?date:date.slice(0,7)]=true;save();close_();go()}
function deleteForever(kind,id){S[kind]=S[kind].filter(x=>x.id!==id);if(kind==='car')S.cmp=S.cmp.filter(x=>x.cid!==id);save();close_();go()}
function pauseRecurrence(kind,id){const x=S[kind]?.find(v=>v.id===id);if(!x)return;if(!x.paused){x.paused=true;x.pausedFrom=today;}else{x.paused=false;x.pausedRanges=x.pausedRanges||[];x.pausedRanges.push({from:x.pausedFrom||today,to:today});delete x.pausedFrom;}save();go()}
function openBudget(cat=''){const b=S.budgets.find(x=>x.cat===cat);const cats=[...new Set([...getCats('var'),...getCats('fix'),'Cartões','Dívidas'])];open_(`${modalHeader(b?'Editar orçamento':'Novo orçamento','Defina quanto pretende gastar por mês.')}<div class="field-grid">${FIELD('Categoria',`<select id="budgetCat" ${b?'disabled':''}>${selectOpts(cats,b?.cat||'Mercado')}</select>`)}${FIELD('Limite mensal (R$)',`<input id="budgetValue" type="number" step="0.01" min="0.01" value="${b?.valor||''}" placeholder="Ex.: 600,00">`)}</div><div class="modal-footer"><button class="btn light" onclick="close_()">Cancelar</button><button class="btn" onclick="saveBudget('${E(cat)}')">Salvar</button></div>`)}
function saveBudget(previous=''){const cat=$('#budgetCat').value,value=Number($('#budgetValue').value);if(!Number.isFinite(value)||value<=0)return er('Informe um limite maior que zero.');const found=S.budgets.find(x=>x.cat===cat);if(found&&previous!==cat)return er('Já existe um orçamento para esta categoria.');if(found)found.valor=value;else S.budgets.push({cat,valor:value});save();close_();go()}
function removeFavorite(id){S.favs=S.favs.filter(x=>x.id!==id);save();go()}
function deleteBudget(cat){if(!confirm('Excluir o limite da categoria '+cat+'?'))return;S.budgets=S.budgets.filter(x=>x.cat!==cat);save();go()}
function openGoal(id=''){const x=S.res.find(v=>v.id===id);open_(`${modalHeader(x?'Editar meta':'Nova meta','Um objetivo por vez, sem complicação.')}<div class="field-grid">${FIELD('Nome da meta',`<input id="goalName" maxlength="90" value="${E(x?.nome||'')}" placeholder="Ex.: Reserva de emergência">`)}${FIELD('Objetivo (R$)',`<input id="goalTarget" type="number" min="0.01" step="0.01" value="${x?.meta??''}" placeholder="5000,00">`)}${FIELD('Já reservado (R$)',`<input id="goalSaved" type="number" min="0" step="0.01" value="${x?.atual??0}">`)}${FIELD('Meta por mês (R$)',`<input id="goalMonthly" type="number" min="0" step="0.01" value="${x?.contrib??0}">`)}<div class="field full">${FIELD('Observação <span class="optional">(opcional)</span>',`<input id="goalNote" maxlength="120" value="${E(x?.obj||'')}" placeholder="Para quê você está guardando">`)}</div></div><div class="modal-footer"><button class="btn light" onclick="close_()">Cancelar</button><button class="btn" onclick="saveGoal('${E(id)}')">Salvar meta</button></div>`)}
function saveGoal(id=''){const nome=$('#goalName').value.trim(),meta=Number($('#goalTarget').value),atual=Number($('#goalSaved').value),contrib=Number($('#goalMonthly').value),obj=$('#goalNote').value.trim();if(!nome||!Number.isFinite(meta)||meta<=0||!Number.isFinite(atual)||atual<0||!Number.isFinite(contrib)||contrib<0)return er('Confira o nome e os valores.');const x=S.res.find(v=>v.id===id);if(x)Object.assign(x,{nome,meta,atual,contrib,obj});else S.res.push({id:uid(),nome,meta,atual,contrib,obj});save();close_();go()}
function openGoalMove(id,sign){const x=S.res.find(v=>v.id===id);if(!x)return;open_(`${modalHeader(sign>0?'Guardar na meta':'Retirar da meta',x.nome)}${FIELD('Valor (R$)',`<input id="goalMoveValue" type="number" min="0.01" step="0.01" value="${sign>0&&x.contrib?x.contrib:''}" placeholder="0,00">`)}<p class="mini-summary">Este controle é manual e não movimenta dinheiro no banco.</p><div class="modal-footer"><button class="btn light" onclick="close_()">Cancelar</button><button class="btn" onclick="moveGoal('${id}',${sign})">Confirmar</button></div>`)}
function moveGoal(id,sign){const x=S.res.find(v=>v.id===id),amount=Number($('#goalMoveValue').value);if(!x||!Number.isFinite(amount)||amount<=0)return er('Informe um valor válido.');if(sign<0&&amount>Number(x.atual))return er('Você não pode retirar mais do que guardou.');x.atual=Math.round((Number(x.atual)+sign*amount)*100)/100;S.reserveHistory.push({id:uid(),goalId:id,valor:sign*amount,data:today});save();close_();go()}
function deleteGoal(id){if(!confirm('Excluir esta meta?'))return;S.res=S.res.filter(x=>x.id!==id);save();go()}
const GENERIC={car:[['nome','Nome do cartão','text'],['banco','Instituição (opcional)','text'],['limite','Limite do cartão (R$)','number'],['fech','Fechamento (1 a 28)','number'],['venc','Vencimento (1 a 28)','number']],cmp:[['cid','Cartão','card'],['desc','Descrição (opcional)','text'],['valor','Valor total (R$)','number'],['parc','Número de parcelas','number'],['data','Data da compra','date']],div:[['nome','Nome da dívida','text'],['inst','Instituição (opcional)','text'],['orig','Valor original (R$)','number'],['parcela','Valor da parcela (R$)','number'],['total','Total de parcelas','number'],['pagas','Parcelas já pagas','number'],['juros','Juros mensal (opcional)','number'],['data','Primeiro vencimento','date']]};
function openGeneric(k,id=''){if(k==='cmp'&&!S.car.length)return open_(`${modalHeader('Antes de continuar')}<p>Cadastre primeiro o cartão que deseja utilizar.</p><div class="modal-footer"><button class="btn" onclick="openGeneric('car')">Cadastrar cartão</button></div>`);const x=S[k]?.find(v=>v.id===id),fields=GENERIC[k];if(!fields)return;open_(`${modalHeader(x?'Editar lançamento':k==='car'?'Novo cartão':k==='cmp'?'Compra parcelada':'Nova dívida')}<div class="field-grid">${fields.map(([name,label,type],i)=>FIELD(label,type==='card'?`<select id="generic${i}">${selectOpts(S.car.map(c=>[c.id,c.nome]),x?.[name]||S.car[0]?.id)}</select>`:`<input id="generic${i}" type="${type}" ${type==='number'?'step="0.01" inputmode="decimal"':''} value="${E(x?.[name]??(type==='date'?today:''))}" placeholder="${E(label)}">`)).join('')}</div><div class="modal-footer"><button class="btn light" onclick="close_()">Cancelar</button><button class="btn" onclick="saveGeneric('${k}','${E(id)}')">Salvar</button></div>`)}
function saveGeneric(k,id=''){const fields=GENERIC[k],x=S[k]?.find(v=>v.id===id),data={};fields.forEach(([name,label,type],i)=>{const v=$(`#generic${i}`).value;data[name]=type==='number'?Number(v||0):v.trim()});if(k==='car'){if(!data.nome)return er('Digite o nome do cartão.');data.fech=Math.min(28,Math.max(1,Math.floor(data.fech||1)));data.venc=Math.min(28,Math.max(1,Math.floor(data.venc||1)));if(data.limite<0)return er('Informe um limite válido.')}else if(k==='cmp'){if(!data.cid||!validDate(data.data)||data.valor<=0||data.parc<1||data.parc>120)return er('Confira o cartão, valor, parcelas e data.');data.parc=Math.floor(data.parc);data.desc=data.desc||'Compra parcelada'}else if(k==='div'){if(!data.nome||!validDate(data.data)||data.parcela<=0||data.total<1||data.pagas<0||data.pagas>data.total)return er('Confira os dados da dívida.');data.total=Math.floor(data.total);data.pagas=Math.floor(data.pagas)}if(x)Object.assign(x,data);else S[k].push({id:uid(),...data,pm:{}});save();close_();go()}
function openInitialBalance(){const s=S.settings||{};open_(`${modalHeader('Saldo inicial','Informe quanto havia disponível no início do mês escolhido.')}<div class="field-grid">${FIELD('Valor (R$)',`<input id="baseAmount" type="number" step="0.01" value="${E(s.startBalance??'')}" placeholder="0,00">`)}${FIELD('A partir de',`<input id="baseMonth" type="month" value="${E(s.baseMonth||ym)}">`)}</div><p class="mini-summary">Não temos acesso a contas bancárias. O saldo será estimado a partir de seus lançamentos registrados, mês a mês, desde esta data.</p><div class="modal-footer"><button class="btn light" onclick="close_()">Cancelar</button>${s.startBalance!==undefined?`<button class="btn d" onclick="deleteInitialBalance()">Remover</button>`:''}<button class="btn" onclick="saveInitialBalance()">Salvar</button></div>`)}
function saveInitialBalance(){const balance=Number($('#baseAmount').value),month=$('#baseMonth').value;if($('#baseAmount').value.trim()===''||!Number.isFinite(balance)||!/^\d{4}-(0[1-9]|1[0-2])$/.test(month))return er('Informe valor e mês válidos.');S.settings={...S.settings,startBalance:balance,baseMonth:month};save();close_();go()}
function deleteInitialBalance(){delete S.settings.startBalance;delete S.settings.baseMonth;save();close_();go()}
function setTheme(theme){setAppearanceOption('mode',theme)}
function backupDados(){const data={versao:2,exportadoEm:new Date().toISOString(),perfil:authUser,dados:S};downloadFile('backup-meu-controle-'+authUser+'.json',JSON.stringify(data,null,2),'application/json')}
function downloadFile(name,contents,type){const blob=new Blob([contents],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function exportCSV(){const rows=[['Tipo','Descrição','Valor','Data','Categoria','Recorrência']];for(const kind of ['rec','fix','var'])for(const i of S[kind])rows.push([kind==='rec'?'Ganho':kind==='fix'?'Gasto fixo':'Gasto variável',i.desc,i.valor,i.data,i.cat,i.freq||'Única']);for(const i of S.cmp)rows.push(['Compra no cartão',i.desc,i.valor,i.data,'Cartão',i.parc+'x']);for(const i of S.res)rows.push(['Reserva',i.nome,i.atual,'','Meta: '+i.meta,'']);const cell=v=>{let x=String(v??'');if(/^\s*[=+@\-]/.test(x))x="'"+x;return '"'+x.replace(/"/g,'""')+'"'};downloadFile('meu-controle-financeiro.csv','\ufeff'+rows.map(r=>r.map(cell).join(';')).join('\n'),'text/csv;charset=utf-8')}
function startUI(){resetVisualIdentity();setInterval(()=>{const newDay=localDate(new Date());if(newDay!==today){today=newDay;if(authToken)go()}},60000);setInterval(refreshFromCloud,30000);window.addEventListener('focus',refreshFromCloud);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshFromCloud()});$('#ym').onchange=e=>e.target.value&&setMonth(e.target.value);$('#m').onclick=e=>{if(e.target.id==='m')close_()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#m').classList.contains('open'))close_()});window.matchMedia?.('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(authToken&&appearance().mode==='auto')applyAppearance()});authBoot()}
startUI();
</script></body></html>
